# Intelligent Hospital Workforce Scheduling System - nginx front end
#
# Placeholders to substitute before use:
#
#   <SERVER_ADDRESS>  the IP address or hostname the portal is reached on
#   <APP_DIR>         absolute path to the checkout (holds run.py, wsgi.py)
#   <APP_USER>        the account the service runs as
#
# ---------------------------------------------------------------------------
# Why this exists
#
# Waitress serves the vendored front-end assets uncompressed and marked
# `Cache-Control: no-cache`, so every page navigation re-fetches roughly
# 550 KB of CSS and JavaScript. Putting nginx in front and letting it serve
# app/static/ off disk takes that to about 130 KB on a first visit and to
# nothing on subsequent ones. Measured on the reference deployment:
#
#   bootstrap.min.css       232,803 ->  31,118 bytes
#   chart.umd.js            205,475 ->  69,680 bytes
#   bootstrap.bundle.min.js  80,721 ->  23,799 bytes
#   app.js + theme.css       33,337 ->   9,049 bytes
#   total                   552,336 -> 133,646 bytes  (75.8% smaller)
#
# ---------------------------------------------------------------------------
# Installing
#
#   sudo cp deploy/nginx-ihwss.conf /etc/nginx/sites-available/ihwss
#   sudo ln -s /etc/nginx/sites-available/ihwss /etc/nginx/sites-enabled/ihwss
#   sudo nginx -t && sudo systemctl reload nginx
#
# If another server block on this host already claims <SERVER_ADDRESS> in its
# server_name, remove it there first: two blocks claiming one name on the same
# port makes nginx pick whichever it parsed first, and the result is confusing
# to debug. Back that file up before editing it.
#
# ---------------------------------------------------------------------------
# Filesystem permissions
#
# nginx workers run as www-data and need to traverse every directory above
# app/static/. A checkout under a home directory will usually be blocked at
# the home directory itself (mode 750), and every static file 403s.
#
# Grant traversal to the web server alone rather than to everyone, so that
# other local accounts gain nothing:
#
#   sudo setfacl -m u:www-data:--x /home/<APP_USER>
#
# `chmod o+x` would work too, but opens the path to every account on the box.
#
# Then close off what www-data can now reach. Both of these are readable by
# default and neither should be:
#
#   sudo chmod 600 <APP_DIR>/.env                  # SECRET_KEY, mail credentials
#   sudo chmod 600 <APP_DIR>/instance/hospital.db  # staff records
#
# The application runs as <APP_USER> and owns both, so 600 costs it nothing.
# Restart rather than reload nginx afterwards: permissions are picked up when
# workers are spawned.
# ---------------------------------------------------------------------------

server {
    listen 80;
    server_name <SERVER_ADDRESS>;

    # Uploads and PDF exports are small; this is headroom, not a target.
    client_max_body_size 8m;

    # -----------------------------------------------------------------------
    # Vendored third-party assets: Bootstrap and Chart.js, ~430 KB together.
    #
    # These are committed files that change only when the vendored version is
    # deliberately bumped, so they can be cached hard. This is the single
    # biggest win available: it takes the bulk of every page load down to
    # nothing on the second and subsequent visits.
    # -----------------------------------------------------------------------
    location /static/vendor/ {
        alias <APP_DIR>/app/static/vendor/;

        expires 365d;
        add_header Cache-Control "public, immutable";
        access_log off;

        # Serve the pre-built .gz beside each file rather than compressing on
        # the fly. See the note on chunked encoding below.
        gzip_static on;
        gzip off;
        gzip_vary on;
    }

    # -----------------------------------------------------------------------
    # The application's own assets: theme.css, app.js, images.
    #
    # base.html references these as a plain url_for('static', ...) with no
    # version query, so there is no cache-busting handle. A long expiry would
    # therefore serve stale CSS to returning users after an edit. `no-cache`
    # here does NOT mean "do not cache": it means the browser keeps the file
    # but revalidates it, so an unchanged asset comes back as a 304 with an
    # empty body rather than being re-sent. That is nearly all of the benefit
    # with none of the staleness risk.
    #
    # If a cache-busting query (?v=<hash>) is added to base.html, this can
    # become `expires 365d` and match the block above.
    # -----------------------------------------------------------------------
    location /static/ {
        alias <APP_DIR>/app/static/;

        add_header Cache-Control "no-cache";
        access_log off;

        # Pre-compressed files only, never on-the-fly compression.
        #
        # When nginx gzips a response itself it cannot know the finished size
        # in advance, so it drops Content-Length and falls back to
        # Transfer-Encoding: chunked. Some corporate proxies and inspection
        # middleboxes handle chunked HTTP badly and simply stall, leaving the
        # browser on a blank page waiting for a body that never lands.
        #
        # gzip_static serves a .gz file that already exists on disk, so nginx
        # knows its length and sends a plain Content-Length. Same bytes over
        # the wire, no chunking. `gzip off` stops it compressing anything that
        # has no .gz companion; those are served uncompressed, also with a
        # Content-Length. Images are already compressed and need no .gz.
        #
        # Regenerate the .gz files after editing any CSS or JS:
        #   bash deploy/compress-static.sh
        gzip_static on;
        gzip off;
        gzip_vary on;
    }

    # -----------------------------------------------------------------------
    # Everything else goes to Waitress, over the loopback. Proxying to the
    # machine's public address instead would send every request out through
    # the external interface and back in again.
    # -----------------------------------------------------------------------
    location / {
        include proxy_params;
        proxy_pass http://127.0.0.1:8000;

        # Leave the proxied HTML uncompressed.
        #
        # nginx.conf ships `gzip on`, and the default gzip_types is text/html,
        # so page responses get compressed even though no gzip_types is set
        # here. Compressing a proxied response means nginx cannot know the
        # length up front, so it drops Content-Length and switches to
        # Transfer-Encoding: chunked. Some corporate proxies and inspection
        # middleboxes handle that badly: the browser receives the first chunk,
        # renders the <title>, and then hangs indefinitely waiting for a body
        # that never arrives.
        #
        # Pages here are 3-20 KB, so the compression was worth very little.
        # The real saving is in app/static/, which is served from disk above
        # and keeps its gzip.
        gzip off;

        # Waitress runs 8 threads against SQLite; a slow report should not be
        # cut off mid-render.
        proxy_read_timeout 120s;
    }
}
