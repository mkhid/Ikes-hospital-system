# Intelligent Hospital Workforce Scheduling System - nginx front end
#
# Placeholders to substitute before use:
#
#   <SERVER_ADDRESS>  the IP address or hostname the portal is reached on
#   <APP_DIR>         absolute path to the checkout (holds run.py, wsgi.py)
#   <APP_USER>        the account the service runs as
#
# ---------------------------------------------------------------------------
# What this does, and what it deliberately does not
#
# It does one thing: serves app/static/ off disk and passes everything else to
# Waitress. That is enough to make the portal reachable on a plain address
# with no port number.
#
# It deliberately does NOT compress, and does not set long cache lifetimes.
# This is a demonstration system for a thesis defence, where predictability
# beats throughput:
#
#   - Compression is the one thing here that can break a page outright. nginx
#     compressing a response cannot know the finished size, so it drops
#     Content-Length for Transfer-Encoding: chunked, and proxies that mishandle
#     chunked HTTP stall with the <title> rendered over a blank body. Serving
#     pre-compressed .gz files avoids that but adds a build step that has to be
#     re-run after every CSS or JS edit - forget it once and nginx serves the
#     stale copy.
#
#   - A long `expires` means a browser can hold a year-old stylesheet. Fine on
#     a real site with versioned filenames. Not fine when you are presenting
#     and have just changed something.
#
# `no-cache` below does not mean "do not cache". The browser keeps the file and
# revalidates it, so an unchanged asset returns 304 with an empty body. Repeat
# navigation costs almost nothing and is always current. A cold load carries
# roughly 550 KB, which is immaterial on a LAN or a decent connection.
#
# If this ever became a real deployment serving many users over slow links,
# compression would be worth revisiting - as pre-compressed files plus
# versioned asset URLs, not as on-the-fly gzip.
#
# ---------------------------------------------------------------------------
# Installing
#
#   sudo cp deploy/nginx-ihwss.conf /etc/nginx/sites-available/ihwss
#   sudo ln -s /etc/nginx/sites-available/ihwss /etc/nginx/sites-enabled/ihwss
#   sudo nginx -t && sudo systemctl reload nginx
#
# If another server block on this host already claims <SERVER_ADDRESS> in its
# server_name, remove it there first: two blocks claiming one name on the same
# port makes nginx pick whichever it parsed first. Back that file up first.
#
# ---------------------------------------------------------------------------
# Filesystem permissions
#
# nginx workers run as www-data and must traverse every directory above
# app/static/. A checkout under a home directory is usually blocked at the home
# directory itself (mode 750), and every static file 403s. Grant traversal to
# the web server alone rather than to every account on the machine:
#
#   sudo setfacl -m u:www-data:--x /home/<APP_USER>
#
# Then close off what www-data can now reach. Both of these are world-readable
# by default and neither should be:
#
#   sudo chmod 600 <APP_DIR>/.env                  # SECRET_KEY, mail credentials
#   sudo chmod 600 <APP_DIR>/instance/hospital.db  # staff records
#
# The application runs as <APP_USER> and owns both, so 600 costs it nothing.
# Restart rather than reload nginx afterwards; permissions are read when
# workers are spawned.
# ---------------------------------------------------------------------------

server {
    listen 80;
    server_name <SERVER_ADDRESS>;

    client_max_body_size 8m;

    location /static/ {
        alias <APP_DIR>/app/static/;

        # Cached and revalidated, never stale. See the note above.
        add_header Cache-Control "no-cache";
        access_log off;

        # No compression: every response carries a plain Content-Length and
        # nothing is ever chunked.
        gzip off;
    }

    location / {
        include proxy_params;
        proxy_pass http://127.0.0.1:8000;

        # nginx.conf ships `gzip on` and its default gzip_types is text/html,
        # so page responses would be compressed and chunked without this.
        gzip off;

        # Waitress runs 8 threads against SQLite; a slow report should not be
        # cut off mid-render.
        proxy_read_timeout 120s;
    }
}
